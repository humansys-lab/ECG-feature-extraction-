# Per-PR gates (document 05 section B, document 06 "CI design").
# Hosted runners have no ECG datasets; dataset-backed jobs run on a self-hosted
# runner labelled `ecg-datasets` with the corpora mounted read-only at
# $ECG_DATA_ROOT (see benchmarks/README.md).
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: suite (py${{ matrix.python }}, numpy ${{ matrix.numpy }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Values are complete version specifiers: they are appended to the package name.
          - {python: "3.10", numpy: "==1.26.*", scipy: "==1.11.*"}
          - {python: "3.11", numpy: "==1.26.*", scipy: "==1.11.*"}
          - {python: "3.12", numpy: "==1.26.*", scipy: "==1.11.*"}
          - {python: "3.12", numpy: "==2.2.*", scipy: ">=1.15,<2"}
          - {python: "3.13", numpy: ">=2.1,<3", scipy: ">=1.14,<2"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt "numpy${{ matrix.numpy }}" "scipy${{ matrix.scipy }}"
          python -m pip install -e ./feature_extraction --no-deps
      - name: Core contract, schema, plotting and unit tests
        run: python -m pytest -q -p no:cacheprovider tests

  gates:
    name: registry, boundaries and performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pip install -e ./feature_extraction --no-deps
      - name: Validation tiers are backed by evidence
        run: python tools/check_validation_registry.py
      - name: Performance budget (reference case, isolated interpreter)
        run: python tools/check_performance.py reference --repeats 5
      - name: Changelog has a section for the package version
        run: python tools/check_changelog.py
      - name: Generated reference docs match the shipped resources; examples run; site builds
        run: |
          python -m pip install "mkdocs>=1.6,<2"
          python tools/build_docs.py --check
          python tools/check_doc_examples.py
          mkdocs build --strict

  import-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-ci.txt import-linter
      - run: python -m pip install -e ./feature_extraction --no-deps
      - name: Layer contracts
        run: lint-imports --config feature_extraction/.importlinter

  os-smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ./feature_extraction pytest jsonschema
      - name: Record contract smoke against the installed package
        run: python -m pytest -q -p no:cacheprovider tests/test_ecg_record_contract.py tests/test_library_design_review.py

  sentinel-golden:
    # Byte-parity against the frozen Phase 0 baseline on the 156-case sentinel set.
    if: ${{ vars.ECG_DATASET_RUNNER == 'enabled' }}
    runs-on: [self-hosted, ecg-datasets]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install (NumPy/SciPy pinned to the baseline's recorded environment)
        run: |
          python -m pip install -r requirements-ci.txt "numpy==2.5.3" "scipy==1.18.1"
          python -m pip install -e ./feature_extraction --no-deps
      - name: Record parity against the frozen ecg-records 0.1.0 baseline
        run: >
          python snapshot_regression.py --data-root "$ECG_DATA_ROOT" --workers 8
          check --tier sentinel --baseline-id ecg-records-0.1.0 --mode record-bytes
          --report sentinel-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentinel-report
          path: sentinel-report.json
