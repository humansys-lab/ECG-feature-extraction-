# Full-corpus record parity against a frozen golden baseline (benchmarks/GOLDEN.md).
# Runs only on a controlled self-hosted runner with the datasets mounted
# read-only at $ECG_DATA_ROOT.  NumPy/SciPy are pinned to the environment the
# baseline recorded (benchmarks/golden/baselines/<id>/expected.*.json), because
# debug-profile diagnostics can differ in the last floating-point digit across
# versions.
name: parity

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: golden baseline id
        default: ecg-records-0.1.0
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  full-golden:
    if: ${{ vars.ECG_DATASET_RUNNER == 'enabled' }}
    runs-on: [self-hosted, ecg-datasets]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          python -m pip install -r requirements-ci.txt "numpy==2.5.3" "scipy==1.18.1"
          python -m pip install -e ./feature_extraction --no-deps
      - name: Full-tier record parity
        run: >
          python snapshot_regression.py --data-root "$ECG_DATA_ROOT" --workers 12
          check --tier full --baseline-id "${{ inputs.baseline || 'ecg-records-0.1.0' }}"
          --mode record-bytes --report full-record-bytes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-golden-report
          path: full-record-bytes.json
