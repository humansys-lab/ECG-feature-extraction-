<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">ECGAgent Simplified Architecture</title>
  <desc id="desc">A concise five-stage architecture: ECG input, feature extraction, evidence and tools, dual-channel agent reasoning, and verified output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#059669"/>
    </marker>
    <style>
      text { font-family: Inter, "DejaVu Sans", Arial, sans-serif; }
      .title { font-size: 38px; font-weight: 750; }
      .subtitle { font-size: 17px; fill: #475569; }
      .step { font-size: 12px; font-weight: 750; letter-spacing: 1.2px; }
      .card-title { font-size: 22px; font-weight: 750; }
      .card-sub { font-size: 14px; fill: #475569; }
      .lane-title { font-size: 17px; font-weight: 750; }
      .lane-sub { font-size: 11.2px; fill: #475569; }
      .arrow-blue { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrowBlue); }
      .arrow-purple { fill: none; stroke: #7c3aed; stroke-width: 2.6; marker-end: url(#arrowPurple); }
      .arrow-green { fill: none; stroke: #059669; stroke-width: 2.6; marker-end: url(#arrowGreen); }
    </style>
  </defs>

  <rect width="1600" height="700" fill="url(#bg)"/>
  <circle cx="1510" cy="60" r="120" fill="#dbeafe" opacity="0.65"/>
  <circle cx="65" cy="690" r="140" fill="#ede9fe" opacity="0.65"/>

  <text x="60" y="68" class="title">ECGAgent — Simplified Architecture</text>
  <text x="60" y="100" class="subtitle">Evidence-driven clinical reasoning with deterministic safety checks</text>

  <!-- 1. ECG input -->
  <g filter="url(#shadow)">
    <rect x="60" y="225" width="220" height="180" rx="20" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="80" y="247" width="72" height="26" rx="13" fill="#dbeafe"/>
    <text x="116" y="265" text-anchor="middle" class="step" fill="#1d4ed8">INPUT</text>
    <text x="170" y="315" text-anchor="middle" class="card-title">12-Lead ECG</text>
    <text x="170" y="344" text-anchor="middle" class="card-sub">Signal + metadata</text>
    <text x="170" y="374" text-anchor="middle" font-size="12" fill="#64748b">Patient study</text>
  </g>

  <!-- 2. Feature extraction -->
  <g filter="url(#shadow)">
    <rect x="320" y="225" width="230" height="180" rx="20" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="340" y="247" width="118" height="26" rx="13" fill="#dbeafe"/>
    <text x="399" y="265" text-anchor="middle" class="step" fill="#1d4ed8">MEASUREMENT</text>
    <text x="435" y="315" text-anchor="middle" class="card-title">ecgfeat</text>
    <text x="435" y="344" text-anchor="middle" class="card-sub">Feature extraction</text>
    <text x="435" y="374" text-anchor="middle" font-size="12" fill="#64748b">Quality · rhythm · morphology</text>
  </g>

  <!-- 3. Evidence and tools -->
  <g filter="url(#shadow)">
    <rect x="590" y="225" width="240" height="180" rx="20" fill="#ffffff" stroke="#818cf8" stroke-width="2"/>
    <rect x="610" y="247" width="94" height="26" rx="13" fill="#e0e7ff"/>
    <text x="657" y="265" text-anchor="middle" class="step" fill="#4338ca">EVIDENCE</text>
    <text x="710" y="315" text-anchor="middle" class="card-title">Evidence Store</text>
    <text x="710" y="344" text-anchor="middle" class="card-sub">Atomic patient facts</text>
    <rect x="630" y="361" width="160" height="27" rx="13" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="710" y="379" text-anchor="middle" font-size="11.5" fill="#4338ca">14 measurement tools</text>
  </g>

  <!-- 4. ECGAgent -->
  <g filter="url(#shadow)">
    <rect x="870" y="160" width="420" height="310" rx="24" fill="#ffffff" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="1080" y="199" text-anchor="middle" font-size="24" font-weight="750">ECGAgent Decision Engine</text>

    <rect x="895" y="225" width="175" height="142" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
    <rect x="913" y="243" width="112" height="26" rx="13" fill="#7c3aed"/>
    <text x="969" y="261" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">MODEL CHANNEL</text>
    <text x="983" y="304" text-anchor="middle" class="lane-title">Clinical Reasoning</text>
    <text x="983" y="332" text-anchor="middle" class="lane-sub">Candidates + interpretation</text>
    <text x="983" y="351" text-anchor="middle" font-size="11.5" fill="#64748b">pass / fail / unknown</text>

    <rect x="1090" y="225" width="175" height="142" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
    <rect x="1108" y="243" width="126" height="26" rx="13" fill="#059669"/>
    <text x="1171" y="261" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">PROGRAM CHANNEL</text>
    <text x="1178" y="304" text-anchor="middle" class="lane-title">Safety Checks</text>
    <text x="1178" y="332" text-anchor="middle" class="lane-sub">Measurements + thresholds</text>
    <text x="1178" y="351" text-anchor="middle" font-size="11.5" fill="#64748b">Deterministic rules</text>

    <path d="M983 367 V390 H1040 V405" class="arrow-purple"/>
    <path d="M1178 367 V390 H1120 V405" class="arrow-green"/>
    <rect x="960" y="405" width="240" height="44" rx="14" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="1080" y="433" text-anchor="middle" font-size="16" font-weight="750">Final Decision</text>
  </g>

  <!-- 5. Verified output -->
  <g filter="url(#shadow)">
    <rect x="1330" y="225" width="210" height="180" rx="20" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
    <rect x="1350" y="247" width="82" height="26" rx="13" fill="#ffedd5"/>
    <text x="1391" y="265" text-anchor="middle" class="step" fill="#c2410c">OUTPUT</text>
    <text x="1435" y="315" text-anchor="middle" class="card-title">Verified Report</text>
    <text x="1435" y="344" text-anchor="middle" class="card-sub">Diagnosis · differential</text>
    <text x="1435" y="374" text-anchor="middle" font-size="12" fill="#64748b">Audit trail + review flag</text>
  </g>

  <!-- Main flow -->
  <path d="M280 315 H320" class="arrow-blue"/>
  <path d="M550 315 H590" class="arrow-blue"/>
  <path d="M830 315 H870" class="arrow-blue"/>
  <path d="M1290 315 H1330" class="arrow-blue"/>

  <!-- Key guarantees -->
  <rect x="300" y="545" width="1000" height="78" rx="22" fill="#0f172a"/>
  <circle cx="440" cy="584" r="8" fill="#60a5fa"/>
  <text x="462" y="590" font-size="15" font-weight="650" fill="#ffffff">Evidence-grounded</text>
  <circle cx="722" cy="584" r="8" fill="#a78bfa"/>
  <text x="744" y="590" font-size="15" font-weight="650" fill="#ffffff">Dual-channel decision</text>
  <circle cx="1030" cy="584" r="8" fill="#34d399"/>
  <text x="1052" y="590" font-size="15" font-weight="650" fill="#ffffff">Human review required</text>
</svg>
