[build-system]
requires = ["setuptools>=75,<82", "wheel>=0.44,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "ecginterpret"
version = "0.1.0"
description = "Rule-based ECG interpretation statements over ecg-records measurements (research and engineering software; not a medical device)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
# TODO(release): license + URLs pending maintainer decision
keywords = ["ecg", "electrocardiography", "interpretation", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "ecg-records>=0.1,<0.3",
  "numpy>=1.26,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["ecginterpret*"]

[tool.setuptools.package-data]
ecginterpret = ["py.typed", "schemas/**/*.json"]
