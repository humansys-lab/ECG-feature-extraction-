# Documentation site: `mkdocs build --strict` (output in build/site), published to
# GitHub Pages by .github/workflows/docs.yml.
# Reference pages are generated by `python tools/build_docs.py` (`--check` in CI),
# and every Python example is executed by `python tools/check_doc_examples.py`.
site_name: ecg-records
site_url: https://humansys-lab.github.io/ECG-feature-extraction-/
site_description: Versioned ECG Record extraction, measurement and plotting (research and engineering software; not a medical device)
repo_url: https://github.com/humansys-lab/ECG-feature-extraction-
edit_uri: blob/main/docs/site/
docs_dir: docs/site
site_dir: build/site
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - User guide:
      - Preparing input signals: guide/input.md
      - Measuring ECGs: guide/measuring.md
      - The ECG Record: guide/record-format.md
      - Reading and querying records: guide/querying.md
      - Saving and loading: guide/serialization.md
      - Plotting: guide/plotting.md
      - Command line: guide/cli.md
      - Configuration: guide/configuration.md
      - Errors and warnings: guide/errors.md
      - Migration guide: migration.md
  - Background:
      - Validation and benchmarks: validation.md
      - Limitations and intended use: limitations.md
      - Compatibility and versioning: compatibility.md
      - FAQ: faq.md
  - Reference:
      - ecgfeat API: reference/api-ecgfeat.md
      - Plotting API (ecgfeat.viz): reference/api-ecgfeat-viz.md
      - ECG Record schema 1.0: reference/ecg-record-schema-1.0.md
      - Legacy crosswalk: reference/legacy-crosswalk.md
  - Developer guide:
      - Architecture: development/architecture.md
      - Contributing and testing: development/contributing.md
      - Golden regression corpus: development/golden-corpus.md
      - Validation policy: development/validation-policy.md
      - Releasing: development/releasing.md
