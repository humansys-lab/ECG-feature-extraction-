[build-system]
requires = ["setuptools>=75,<82", "wheel>=0.44,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-records-viz"
version = "0.1.0"
description = "Matplotlib plots of ECG Records and their raw signals; research and engineering software, not a medical device"
readme = "README.md"
requires-python = ">=3.10,<3.14"
# TODO(release): license + URLs pending maintainer decision
keywords = ["ecg", "electrocardiography", "visualization", "matplotlib"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]
dependencies = [
  "ecg-records>=0.1,<0.3",
  "matplotlib>=3.7,<4",
  "numpy>=1.26,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ecgrecords_viz*"]

[tool.setuptools.package-data]
ecgrecords_viz = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
