[build-system]
requires = ["setuptools>=77,<82", "wheel>=0.44,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-records"
version = "0.1.0"
description = "Versioned ECG Record extraction and measurement (research and engineering software; not a medical device)"
readme = "README.package.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "humansys-lab" }]
maintainers = [{ name = "humansys-lab" }]
keywords = ["ecg", "electrocardiography", "signal-processing", "delineation", "physionet"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
]

[project.urls]
Homepage = "https://github.com/humansys-lab/ECG-feature-extraction-"
Repository = "https://github.com/humansys-lab/ECG-feature-extraction-"
Issues = "https://github.com/humansys-lab/ECG-feature-extraction-/issues"
Documentation = "https://github.com/humansys-lab/ECG-feature-extraction-/tree/main/docs/site"
Changelog = "https://github.com/humansys-lab/ECG-feature-extraction-/blob/main/feature_extraction/CHANGELOG.md"

[project.scripts]
ecg-record = "ecgfeat.cli:main"

[project.optional-dependencies]
viz = ["ecg-records-viz>=0.1,<1"]
interpret = ["ecginterpret>=0.1,<1"]
performance = ["numba>=0.59,<0.67"]
wfdb = ["wfdb>=4.1,<5"]
dev = [
  "build>=1.2,<2",
  "hypothesis>=6.100,<7",
  "import-linter>=2,<3",
  "jsonschema>=4.22,<5",
  "pytest>=8,<10",
  "twine>=5,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ecgfeat*"]

[tool.setuptools.package-data]
ecgfeat = ["py.typed", "schemas/**/*.json"]
