[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecgfeat-dxl-inspired"
version = "0.1.0"
description = "DXL-inspired 12-lead ECG feature extraction scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ecgfeat*"]
